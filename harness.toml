# Harness v4 configuration for Codex CLI / Claude Code workflow.

[project]
name = "k8s-deploy-agent"
version = "0.1.0"
description = "On-premise Kubernetes migration agent that analyzes source repositories and generates Jenkins CI plus Rancher Fleet GitOps assets."

[agent]
# default = "security-reviewer"

[env]
# CLAUDE_CODE_SUBPROCESS_ENV_SCRUB = "1"

[runtime]
agent = "codex-cli"
language = "python"
package_manager = "uv"
python = ">=3.11"

[commands]
test = "UV_CACHE_DIR=.uv-cache /home/daolts/.local/bin/uv run pytest -q"
dry_run = "UV_CACHE_DIR=.uv-cache /home/daolts/.local/bin/uv run k8s-deploy-agent dry-run --config .agent/config/demo-inputs.example.yaml --output ./out/demo"

[safety.permissions]
deny = [
  "sudo",
  "Bash(sudo:*)",
  "git push --force",
]
ask = [
  "rm -r",
  "rm -rf",
  "git push",
  "Bash(rm -r:*)",
  "Bash(rm -rf:*)",
  "Bash(rm -fr:*)",
  "Bash(rm -R:*)",
  "Bash(rm -Rf:*)",
  "Bash(rm -fR:*)",
  "Bash(git push --force:*)",
]

[safety.sandbox]
failIfUnavailable = false

[safety.files]
secret_values_forbidden = true
protected = [
  ".env",
  "secrets/**",
]

[github]
enabled = false
default_branch = "main"
task_branch_prefix = "task/"

[review]
require_before_pr = true
focus = [
  "secret leakage",
  "offline runtime compatibility",
  "generated CI/GitOps correctness",
  "test coverage",
]

[test]
auto_run = true
agent = "agents/test-agent.md"

[plan]
auto_run = true
agent = "agents/task-decomposer.md"
decomposer_mode = "inline"
decomposer_command = ""
allow_inline_fallback = true
proposal_dir = ".harness/shared/planning"
planning_event_log = ".harness/events/planning.jsonl"
gate_work = true
allow_mid_work_split = true
