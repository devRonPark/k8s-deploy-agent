[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-deploy-agent"
version = "0.1.0"
description = "On-premise agent for generating Jenkins CI and Rancher Fleet CD assets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
k8s-deploy-agent = "k8s_deploy_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["k8s_deploy_agent"]

[tool.setuptools.package-dir]
k8s_deploy_agent = "."
